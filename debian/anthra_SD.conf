# Options for the anthra_SD skin (VDR text2skin plugin), make syntax.
# After changes run: vdr-skin-anthra-update anthra_SD
# and restart VDR. Escape slashes in paths with backslashes.

###### SKINOPTIONS:


###### to comment an option just place a '#' at the beginning of the line
###### to uncomment an option please remove the leading '#'
###### !!! Take care to uncomment only ONE option for CHANNELLOGOS, SIGNAL and MARQUEE !!!

###### CHANNELLOGOS ######
#NOLOGOS = 1
LOGOSLEFT = 1

###### path to the channellogos, escape slashes with backslashes! ######
###### e.g. CHANNELLOGOSPATH = \/etc\/vdr\/plugins\/text2skin\/liquid-logos4anthra #####
CHANNELLOGOSPATH = \/var\/lib\/vdr\/anthralogos

###### EPGIMAGES ######
#EPGIMAGES = 1

###### path to the epgimages, escape slashes with backslashes! ######
###### e.g. EPGIMAGESPATH = \/etc\/vdr\/plugins\/tvm2vdr\/epgimages ######
EPGIMAGESPATH = \/var\/cache\/vdr\/epgimages

###### EPGIMAGESFORMAT #####
####### default EPGIMAGESFORMAT is png, uncomment the following line, if you have jpgs ######
#EPGIMAGESJPG = 1

##### SIGNAL ######
DIGIT_SIGNAL = 1
#GRAPH_SIGNAL = 1

##### MARQUEE ######
NOMARQUEE = 1
#ACTIVE_ITEM_MARQUEE = 1
#FULLMARQUEE = 1


